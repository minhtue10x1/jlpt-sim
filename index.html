        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5 Audio API.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Official JEES JLPT Exam Timer simulation for levels N1 through N5 with precise official section timings, realistic 3-phase break intermissions, synthesized JEES chime sound effects, and multilingual support in English, Vietnamese, and Japanese.",
        "image": "https://jlptsim.web.app/header.png",
        "screenshot": "https://jlptsim.web.app/1.jpg",
        "creator": {
          "@type": "Person",
          "name": "minhtue10x1",

        },
        "author": {
          "@type": "Person",

        },
        "inLanguage": ["en", "vi", "ja"]
      },
      {
        "@type": "FAQPage",
        "@id": "https://jlptsim.web.app/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is the official exam duration for JLPT N1?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The JLPT N1 exam consists of two sections: Section 1 (Language Knowledge: Vocabulary/Grammar and Reading) lasts 110 minutes; followed by a 30-minute break (consisting of paper collection, intermission, and audio test check); and Section 2 (Listening) lasts 55 minutes. Total exam time is 165 minutes."
            }
          },
          {
            "@type": "Question",
            "name": "What is the official exam duration for JLPT N2?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The JLPT N2 exam consists of two sections: Section 1 (Language Knowledge: Vocabulary/Grammar and Reading) lasts 105 minutes; followed by a 30-minute break; and Section 2 (Listening) lasts 50 minutes. Total exam time is 155 minutes."
            }
          },
          {
            "@type": "Question",
            "name": "What is the official exam duration for JLPT N3?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The JLPT N3 exam consists of three sections: Section 1 (Language Knowledge: Vocabulary) lasts 30 minutes; followed by a 20-minute break; Section 2 (Language Knowledge: Grammar and Reading) lasts 70 minutes; followed by a 30-minute break; and Section 3 (Listening) lasts 40 minutes. Total exam time is 140 minutes."
            }
          },
          {
            "@type": "Question",
            "name": "What is the official exam duration for JLPT N4?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The JLPT N4 exam consists of three sections: Section 1 (Language Knowledge: Vocabulary) lasts 25 minutes; followed by a 20-minute break; Section 2 (Language Knowledge: Grammar and Reading) lasts 55 minutes; followed by a 30-minute break; and Section 3 (Listening) lasts 35 minutes. Total exam time is 115 minutes."
            }
          },
          {
            "@type": "Question",
            "name": "What is the official exam duration for JLPT N5?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The JLPT N5 exam consists of three sections: Section 1 (Language Knowledge: Vocabulary) lasts 20 minutes; followed by a 20-minute break; Section 2 (Language Knowledge: Grammar and Reading) lasts 50 minutes; followed by a 30-minute break; and Section 3 (Listening) lasts 30 minutes. Total exam time is 100 minutes."
            }
          },
          {
            "@type": "Question",
            "name": "How do breaks work in this JLPT simulation?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "After each exam section finishes, the simulator automatically transitions into the official break period (20 minutes between Section 1 and Section 2, and 30 minutes before Listening). When the break concludes, the next exam section starts automatically, or examinees can click 'Skip Break' to begin the next section immediately."
            }
          }
        ]
      }
    ]
  }

<body>

  <!-- Static background layer (1.jpg) -->
  <div id="bg-layer"></div>
  <div id="bg-overlay"></div>

  <!-- Progress Bar -->
  <div id="progress-bar-track">
    <div id="progress-bar-fill"></div>
  </div>

  <!-- Header -->
  <header>
    <span id="app-title"></span>
    <div id="header-controls">
      <!-- Language segmented bar -->
      <div class="segmented" id="lang-seg" role="radiogroup" aria-label="Select language">
        <button class="seg-btn active" data-value="vi" role="radio" aria-checked="true">VI</button>
        <button class="seg-btn"       data-value="en" role="radio" aria-checked="false">EN</button>
        <button class="seg-btn"       data-value="ja" role="radio" aria-checked="false">JP</button>
        <span class="seg-pill" id="lang-pill"></span>
      </div>
      <button id="dark-toggle" class="icon-btn" title="Toggle overlay">◑</button>
    </div>
  </header>

  <!-- Brand Logo Badge (Top-Left of body) -->
  <div class="brand-badge" id="brand-badge">
    <div class="brand-card">
      <img src="header.png" alt="JLPT Exam Simulation" class="brand-logo-img" />
    </div>
  </div>

  <!-- Main -->
  <main>

    <!-- Level Selector -->
    <section id="level-section" class="selector-section">
      <label id="label-level" class="selector-label"></label>
      <div class="segmented" id="level-seg" role="radiogroup" aria-label="Select JLPT level">
        <button class="seg-btn active" data-value="N1" role="radio" aria-checked="true">N1</button>
        <button class="seg-btn" data-value="N2" role="radio" aria-checked="false">N2</button>
        <button class="seg-btn" data-value="N3" role="radio" aria-checked="false">N3</button>
        <button class="seg-btn" data-value="N4" role="radio" aria-checked="false">N4</button>
        <button class="seg-btn" data-value="N5" role="radio" aria-checked="false">N5</button>
        <span class="seg-pill" id="level-pill"></span>
      </div>
    </section>

    <!-- Mode Selector -->
    <section id="mode-section" class="selector-section">
      <label id="label-mode" class="selector-label"></label>
      <div class="segmented wide" id="mode-seg" role="radiogroup" aria-label="Select exam mode">
        <button class="seg-btn active" data-value="full"         role="radio" aria-checked="true"></button>
        <button class="seg-btn"       data-value="sec1"         role="radio" aria-checked="false" id="btn-sec1"></button>
        <button class="seg-btn"       data-value="vocab_only"   role="radio" aria-checked="false" id="btn-vocab-only"></button>
        <button class="seg-btn"       data-value="reading_only" role="radio" aria-checked="false" id="btn-reading-only"></button>
        <button class="seg-btn"       data-value="vocab"        role="radio" aria-checked="false" id="btn-vocab"></button>
        <button class="seg-btn"       data-value="grammar"      role="radio" aria-checked="false" id="btn-grammar"></button>
        <button class="seg-btn"       data-value="listening"    role="radio" aria-checked="false" id="btn-listening"></button>
        <span class="seg-pill" id="mode-pill"></span>
      </div>
    </section>

    <!-- Timeline Preview -->
    <section id="timeline-section">
      <div id="timeline-preview"></div>
    </section>

    <!-- Hero Timer Card -->
    <section id="timer-section">
      <div id="phase-label"></div>
      <div id="countdown">110:00</div>
      <div id="subphase-label"></div>
    </section>

    <!-- Controls -->
    <section id="controls-section">
      <button id="start-btn"></button>
      <button id="skip-break-btn" class="hidden"></button>
      <button id="pause-btn"      class="hidden"></button>
      <button id="reset-btn"      class="hidden hold-btn">
        <span class="hold-text" id="hold-text"></span>
        <span class="hold-fill"></span>
      </button>
    </section>

  </main>

  <!-- Fixed Bottom Footer Bar (Always visible at the bottom) -->
  <footer id="app-footer">
    <p class="footer-credit">
      <span>Official JEES Standards</span>
      <span class="footer-sep">·</span>
      <span>Crafted by <a href="https://github.com/minhtue10x1" target="_blank" rel="noopener noreferrer" class="footer-link">minhtue10x1</a></span>
      <span class="footer-sep">·</span>
      <a href="https://github.com/minhtue10x1/jlpt-sim" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub</a>
    </p>
  </footer>

  <!-- Warning Flash -->
  <div id="warning-flash" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
